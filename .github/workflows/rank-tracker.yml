name: rank-tracker

on:
  schedule:
    - cron: "0 5 * * *"   # roz 10:00 AM PKT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run rank agent
        env:
          SERPER_KEY: ${{ secrets.SERPER_KEY }}
        run: python agent/local_agent.py

      - name: Commit results
        run: |
          git config user.name "rank-agent"
          git config user.email "rank-agent@users.noreply.github.com"
          git add agent/agent_state.json agent/history.csv agent/report.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "rank report $(date -u +%Y-%m-%d)"
            git push
          fi
